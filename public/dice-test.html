<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chance Dice v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #07070c; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; color: #fff; }
  #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
  .result-display {
    position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
    font-size: 72px; font-weight: 800; letter-spacing: -2px; opacity: 0; pointer-events: none;
    text-shadow: 0 0 40px rgba(130,141,152,0.6), 0 0 80px rgba(130,141,152,0.3);
    z-index: 10; transition: opacity 0.4s ease;
  }
  .result-display.show { opacity: 1; animation: resultPop 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes resultPop {
    0% { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
    50% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  }
  .roll-btn {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    padding: 14px 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.11);
    background: rgba(255,255,255,0.08); color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; z-index: 20; outline: none; -webkit-tap-highlight-color: transparent;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9); box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }
  .roll-btn:active { transform: translateX(-50%) scale(0.96) translateY(1px); }
  .label { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 1px; z-index: 20; }
</style>
</head>
<body>
<div class="label">CHANCE DICE v2</div>
<div class="result-display" id="result"></div>
<button class="roll-btn" id="rollBtn">Roll</button>
<canvas id="canvas"></canvas>

<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.151.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.151.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as CANNON from 'https://cdn.skypack.dev/cannon-es';
import * as THREE from 'three';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

const canvasEl = document.getElementById('canvas');
const resultEl = document.getElementById('result');
const rollBtn = document.getElementById('rollBtn');

let renderer, scene, camera, diceMesh, physicsWorld;
let diceSettled = 0;
let isRolling = false;
let readyToRoll = false;

const params = {
  numberOfDice: 2,
  segments: 40,
  edgeRadius: 0.07,
  notchRadius: 0.12,
  notchDepth: 0.1,
};

const diceArray = [];

initPhysics();
initScene();

window.addEventListener('resize', updateSceneSize);
rollBtn.addEventListener('click', function() { if (readyToRoll) throwDice(); });

function initScene() {
  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, canvas: canvasEl });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 300);
  camera.position.set(0, 18, 16);
  camera.lookAt(0, -4, 0);

  updateSceneSize();

  // Premium lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));

  const keyLight = new THREE.PointLight(0xffffff, 0.9);
  keyLight.position.set(8, 25, 10);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 2048;
  keyLight.shadow.mapSize.height = 2048;
  keyLight.shadow.camera.near = 5;
  keyLight.shadow.camera.far = 80;
  keyLight.shadow.radius = 4;
  scene.add(keyLight);

  const rimLight = new THREE.PointLight(0x5E9ABB, 0.25);
  rimLight.position.set(-12, 10, -8);
  scene.add(rimLight);

  const fillLight = new THREE.PointLight(0x828D98, 0.12);
  fillLight.position.set(0, -3, 12);
  scene.add(fillLight);

  createFloor();

  diceMesh = createDiceMesh();
  for (let i = 0; i < params.numberOfDice; i++) {
    diceArray.push(createDice());
    addDiceEvents(diceArray[i]);
  }

  // Hide dice off-screen initially — no physics running on them
  diceArray.forEach(function(d) {
    d.body.position.set(0, -20, 0);
    d.mesh.position.copy(d.body.position);
    d.body.type = CANNON.Body.STATIC;
  });

  // Mark ready after a short delay to let scene initialize
  setTimeout(function() {
    readyToRoll = true;
    throwDice();
  }, 300);

  render();
}

function initPhysics() {
  physicsWorld = new CANNON.World({
    allowSleep: true,
    gravity: new CANNON.Vec3(0, -40, 0),
  });
  physicsWorld.defaultContactMaterial.restitution = 0.2;
  physicsWorld.defaultContactMaterial.friction = 0.4;
}

function createFloor() {
  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.ShadowMaterial({ opacity: 0.12 })
  );
  floor.receiveShadow = true;
  floor.position.y = -7;
  floor.quaternion.setFromAxisAngle(new THREE.Vector3(-1, 0, 0), Math.PI * 0.5);
  scene.add(floor);

  var floorBody = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane() });
  floorBody.position.copy(floor.position);
  floorBody.quaternion.copy(floor.quaternion);
  physicsWorld.addBody(floorBody);

  // Walls to keep dice in view
  var wallPositions = [
    { p: [15, 0, 0], r: [0, -Math.PI / 2, 0] },
    { p: [-15, 0, 0], r: [0, Math.PI / 2, 0] },
    { p: [0, 0, 10], r: [Math.PI / 2, 0, 0] },
    { p: [0, 0, -15], r: [-Math.PI / 2, 0, 0] },
  ];
  wallPositions.forEach(function(w) {
    var body = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane() });
    body.position.set(w.p[0], w.p[1], w.p[2]);
    body.quaternion.setFromEuler(w.r[0], w.r[1], w.r[2]);
    physicsWorld.addBody(body);
  });
}

function createDiceMesh() {
  var outerMat = new THREE.MeshStandardMaterial({ color: 0xf0ede8, roughness: 0.3, metalness: 0.02 });
  var innerMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.15, metalness: 0.6, side: THREE.DoubleSide });

  var group = new THREE.Group();
  var innerMesh = new THREE.Mesh(createInnerGeometry(), innerMat);
  var outerMesh = new THREE.Mesh(createBoxGeometry(), outerMat);
  outerMesh.castShadow = true;
  group.add(innerMesh, outerMesh);
  return group;
}

function createDice() {
  var mesh = diceMesh.clone();
  scene.add(mesh);

  var body = new CANNON.Body({
    mass: 0.4,
    shape: new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)),
    sleepTimeLimit: 0.1,
    sleepSpeedLimit: 0.15,
  });
  physicsWorld.addBody(body);

  return { mesh: mesh, body: body, value: 0 };
}

function createBoxGeometry() {
  var boxGeometry = new THREE.BoxGeometry(1, 1, 1, params.segments, params.segments, params.segments);
  var positionAttr = boxGeometry.attributes.position;
  var subCubeHalfSize = 0.5 - params.edgeRadius;

  for (var i = 0; i < positionAttr.count; i++) {
    var position = new THREE.Vector3().fromBufferAttribute(positionAttr, i);

    var subCube = new THREE.Vector3(Math.sign(position.x), Math.sign(position.y), Math.sign(position.z)).multiplyScalar(subCubeHalfSize);
    var addition = new THREE.Vector3().subVectors(position, subCube);

    if (Math.abs(position.x) > subCubeHalfSize && Math.abs(position.y) > subCubeHalfSize && Math.abs(position.z) > subCubeHalfSize) {
      addition.normalize().multiplyScalar(params.edgeRadius);
      position = subCube.add(addition);
    } else if (Math.abs(position.x) > subCubeHalfSize && Math.abs(position.y) > subCubeHalfSize) {
      addition.z = 0; addition.normalize().multiplyScalar(params.edgeRadius);
      position.x = subCube.x + addition.x; position.y = subCube.y + addition.y;
    } else if (Math.abs(position.x) > subCubeHalfSize && Math.abs(position.z) > subCubeHalfSize) {
      addition.y = 0; addition.normalize().multiplyScalar(params.edgeRadius);
      position.x = subCube.x + addition.x; position.z = subCube.z + addition.z;
    } else if (Math.abs(position.y) > subCubeHalfSize && Math.abs(position.z) > subCubeHalfSize) {
      addition.x = 0; addition.normalize().multiplyScalar(params.edgeRadius);
      position.y = subCube.y + addition.y; position.z = subCube.z + addition.z;
    }

    var notchWave = function(v) { v = (1 / params.notchRadius) * v; v = Math.PI * Math.max(-1, Math.min(1, v)); return params.notchDepth * (Math.cos(v) + 1); };
    var notch = function(pos) { return notchWave(pos[0]) * notchWave(pos[1]); };
    var offset = 0.23;

    if (position.y === 0.5) { position.y -= notch([position.x, position.z]); }
    else if (position.x === 0.5) { position.x -= notch([position.y + offset, position.z + offset]); position.x -= notch([position.y - offset, position.z - offset]); }
    else if (position.z === 0.5) { position.z -= notch([position.x - offset, position.y + offset]); position.z -= notch([position.x, position.y]); position.z -= notch([position.x + offset, position.y - offset]); }
    else if (position.z === -0.5) { position.z += notch([position.x + offset, position.y + offset]); position.z += notch([position.x + offset, position.y - offset]); position.z += notch([position.x - offset, position.y + offset]); position.z += notch([position.x - offset, position.y - offset]); }
    else if (position.x === -0.5) { position.x += notch([position.y + offset, position.z + offset]); position.x += notch([position.y + offset, position.z - offset]); position.x += notch([position.y, position.z]); position.x += notch([position.y - offset, position.z + offset]); position.x += notch([position.y - offset, position.z - offset]); }
    else if (position.y === -0.5) { position.y += notch([position.x + offset, position.z + offset]); position.y += notch([position.x + offset, position.z]); position.y += notch([position.x + offset, position.z - offset]); position.y += notch([position.x - offset, position.z + offset]); position.y += notch([position.x - offset, position.z]); position.y += notch([position.x - offset, position.z - offset]); }

    positionAttr.setXYZ(i, position.x, position.y, position.z);
  }

  boxGeometry.deleteAttribute('normal');
  boxGeometry.deleteAttribute('uv');
  boxGeometry = BufferGeometryUtils.mergeVertices(boxGeometry);
  boxGeometry.computeVertexNormals();
  return boxGeometry;
}

function createInnerGeometry() {
  var baseGeometry = new THREE.PlaneGeometry(1 - 2 * params.edgeRadius, 1 - 2 * params.edgeRadius);
  var offset = 0.48;
  return BufferGeometryUtils.mergeBufferGeometries([
    baseGeometry.clone().translate(0, 0, offset),
    baseGeometry.clone().translate(0, 0, -offset),
    baseGeometry.clone().rotateX(0.5 * Math.PI).translate(0, -offset, 0),
    baseGeometry.clone().rotateX(0.5 * Math.PI).translate(0, offset, 0),
    baseGeometry.clone().rotateY(0.5 * Math.PI).translate(-offset, 0, 0),
    baseGeometry.clone().rotateY(0.5 * Math.PI).translate(offset, 0, 0),
  ], false);
}

function addDiceEvents(dice) {
  dice.body.addEventListener('sleep', function(e) {
    dice.body.allowSleep = false;

    var euler = new CANNON.Vec3();
    e.target.quaternion.toEuler(euler);

    var eps = 0.15;
    var isZero = function(a) { return Math.abs(a) < eps; };
    var isHalfPi = function(a) { return Math.abs(a - 0.5 * Math.PI) < eps; };
    var isMinusHalfPi = function(a) { return Math.abs(0.5 * Math.PI + a) < eps; };
    var isPiOrMinusPi = function(a) { return Math.abs(Math.PI - a) < eps || Math.abs(Math.PI + a) < eps; };

    var value = 0;
    if (isZero(euler.z)) {
      if (isZero(euler.x)) value = 1;
      else if (isHalfPi(euler.x)) value = 4;
      else if (isMinusHalfPi(euler.x)) value = 3;
      else if (isPiOrMinusPi(euler.x)) value = 6;
      else { dice.body.allowSleep = true; return; }
    } else if (isHalfPi(euler.z)) { value = 2; }
    else if (isMinusHalfPi(euler.z)) { value = 5; }
    else { dice.body.allowSleep = true; return; }

    dice.value = value;
    diceSettled++;

    if (diceSettled === params.numberOfDice) {
      var total = diceArray.reduce(function(sum, d) { return sum + (d.value || 0); }, 0);
      showResult(total);
    }
  });
}

function showResult(total) {
  isRolling = false;
  resultEl.textContent = total;
  resultEl.classList.add('show');
  setTimeout(function() { resultEl.classList.remove('show'); }, 2500);
}

function render() {
  physicsWorld.fixedStep();
  for (var i = 0; i < diceArray.length; i++) {
    diceArray[i].mesh.position.copy(diceArray[i].body.position);
    diceArray[i].mesh.quaternion.copy(diceArray[i].body.quaternion);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(render);
}

function updateSceneSize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function throwDice() {
  if (isRolling) return;
  isRolling = true;
  diceSettled = 0;
  resultEl.classList.remove('show');
  resultEl.textContent = '';

  diceArray.forEach(function(d, idx) {
    // Make dynamic
    d.body.type = CANNON.Body.DYNAMIC;
    d.body.mass = 0.4;
    d.body.updateMassProperties();

    d.value = 0;
    d.body.velocity.setZero();
    d.body.angularVelocity.setZero();

    // Start position — above center, slightly spread
    var xOff = (idx - 0.5) * 2.2;
    d.body.position.set(xOff + (Math.random() - 0.5) * 0.8, 8 + Math.random() * 2, -1 + Math.random());
    d.mesh.position.copy(d.body.position);

    // Random starting rotation
    d.mesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
    d.body.quaternion.copy(d.mesh.quaternion);

    // Throw impulse — controlled downward with gentle forward arc and spin
    var throwStrength = 1.5 + Math.random() * 1.0;
    var sidePush = (Math.random() - 0.5) * 1.5;
    d.body.applyImpulse(
      new CANNON.Vec3(sidePush, -throwStrength * 0.5, throwStrength * 0.3),
      new CANNON.Vec3((Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2)
    );

    d.body.allowSleep = true;
  });
}
</script>
</body>
</html>
