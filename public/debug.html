<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chance Debug</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#07070c;color:#A8B2BD;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;padding:20px;}
h1{font-size:16px;color:#fff;margin-bottom:16px;}
.row{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px;margin-bottom:8px;}
.key{font-size:11px;color:#565F67;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px;}
.val{font-size:14px;color:#e0e4e8;word-break:break-all;}
.empty{color:#3D444A;font-style:italic;}
button{margin-top:12px;padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#A8B2BD;font-size:13px;cursor:pointer;}
</style>
</head>
<body>
<h1>Chance — localStorage Debug</h1>
<div id="out"></div>
<button onclick="location.reload()">Refresh</button>
<button onclick="history.back()">Back</button>
<script>
var keys = [
  'chance_picked_categories',
  'chance_curate_categories',
  'chance_dice_skin',
  'chance_session_id',
  'chance_old_session_id',
  'chance_skin_effect_intensity',
  'chance_feed_auth'
];
var out = document.getElementById('out');
keys.forEach(function(k) {
  var v = localStorage.getItem(k);
  var div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = '<div class="key">' + k + '</div><div class="val ' + (v ? '' : 'empty') + '">' + (v || 'not set') + '</div>';
  out.appendChild(div);
});
</script>
</body>
</html>
